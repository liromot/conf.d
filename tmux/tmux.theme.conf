# Status bar alignment and refresh rate
set -g status-justify left
set -g status-interval 2
set -g status-position bottom

# Global status bar styling
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status bar (Session name)
set -g status-left-length 30
set -g status-left "#[bg=#6667d4,fg=#ffffff,bold] #S #[bg=default,fg=#89b4fa]"

# Right status bar (Git branch, Date and Time)
set -g status-right "#[bg=#45475a,fg=#edda2f] ⎇ #[fg=#cdd6f4]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'null') #[fg=#edda2f]⏱ #[fg=#cdd6f4]%H:%M %d-%b-%y"

# Current active window style
set -g window-status-current-format "#[fg=#11111b,bg=#7879ff,bold] #I:#W #[fg=#7879ff,bg=default]"

# Inactive window style
# set -g window-status-format "#[fg=#45475a,bg=default]  #I:#W  "

# Command prompt styling
# set -g message-style "bg=#313244,fg=#cdd6f4"

# Inactive pane border color
set -g pane-border-style fg=colour240

# Active pane border color
set -g pane-active-border-style "fg=#6667d4"
set -g pane-border-lines single # options: single, double, heavy, simple, or off
